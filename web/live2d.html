<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eceae9" />
    <title>小狐狸 2D</title>
    <style>
      :root { --bg: #eceae9; --cream: #fff8f1; --edge: rgba(240, 126, 62, 0.22); --orange: #f07e3e; --ink: #6b3b22; --ink-soft: #9a8378; }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg);
        font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; color: var(--ink);
        -webkit-tap-highlight-color: transparent; }
      #stage2d { position: fixed; inset: 0; }
      .dock { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(12px + env(safe-area-inset-bottom));
        display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
      .hint { margin: 0; font-size: 13px; letter-spacing: 0.04em; color: var(--ink-soft); user-select: none; text-align: center; }
      .bar-wrap { max-width: 100%; pointer-events: auto; border-radius: 999px; background: rgba(255, 255, 255, 0.62);
        box-shadow: 0 6px 24px rgba(107, 59, 34, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); overflow: hidden; }
      .toolbar { display: flex; gap: 6px; padding: 6px; overflow-x: auto; scrollbar-width: none; touch-action: pan-x; }
      .toolbar::-webkit-scrollbar { display: none; }
      .pill { flex: none; appearance: none; border: 1px solid var(--edge); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 14px;
        line-height: 1.2; color: var(--ink); background: var(--cream); cursor: pointer; white-space: nowrap; transition: background 0.15s, transform 0.12s; }
      .pill:hover { background: #ffeede; }
      .pill:active { transform: scale(0.95); }
      .pill:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
      .pill[aria-pressed='true'] { background: var(--orange); border-color: #e0672a; color: #fff; }
      .sep { flex: none; width: 1px; height: 22px; align-self: center; background: var(--edge); }
      .loader { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 999px;
        background: rgba(255, 255, 255, 0.7); font-size: 14px; color: var(--ink-soft); transition: opacity 0.5s; pointer-events: none; }
      .loader.hidden { opacity: 0; }
      @media (max-width: 480px) { .pill { padding: 8px 12px; font-size: 13px; } .hint { font-size: 12px; } }
    </style>
  </head>
  <body>
    <div id="stage2d"></div>
    <div class="loader">小狐狸加载中…</div>
    <!-- Standalone test page for the Live2D-style 2D fox (src/live2d/app.js). -->
    <script type="module" src="./src/live2d/page.js"></script>
  </body>
</html>
